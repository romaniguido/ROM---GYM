<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1013" media="(prefers-color-scheme: dark)">
<title>ROM GYM</title>
<meta name="description" content="ROM GYM: registro de entrenamiento de hipertrofia. Rutinas, series y progresion de cargas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROM GYM">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F1F3F8; --card:#FFFFFF; --card-2:#F6F7FB; --line:#E6E9F1; --line-2:#D6DAE6;
  --ink:#131620; --ink-2:#565D70; --ink-3:#8B93A6;
  --accent:#4B5BD7; --accent-soft:#ECEEFC; --accent-ink:#FFFFFF;
  --good:#17A05C; --good-soft:#E6F6EE;
  --gold:#D99413; --gold-soft:#FBF1DC;
  --bad:#D14638; --bad-soft:#FBEAE8;
  --body-off:#C3CADB; --body-line:#AAB3C8; --ring-track:#E6E9F1;
  --r:22px; --r-sm:14px;
  --sh:0 1px 2px rgba(19,22,32,.04), 0 10px 24px -18px rgba(19,22,32,.30);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F13; --card:#161A21; --card-2:#1D222B; --line:#252B35; --line-2:#333A47;
    --ink:#EDEFF4; --ink-2:#A0A8B8; --ink-3:#6F7889;
    --accent:#8492FF; --accent-soft:#1C2033; --accent-ink:#0D0F13;
    --good:#3EC181; --good-soft:#12251B;
    --gold:#F0B444; --gold-soft:#2B2214;
    --bad:#E86354; --bad-soft:#2C1917;
    --body-off:#2B313D; --body-line:#3C4454; --ring-track:#252B35;
    --sh:0 1px 2px rgba(0,0,0,.5), 0 12px 28px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F13; --card:#161A21; --card-2:#1D222B; --line:#252B35; --line-2:#333A47;
  --ink:#EDEFF4; --ink-2:#A0A8B8; --ink-3:#6F7889;
  --accent:#8492FF; --accent-soft:#1C2033; --accent-ink:#0D0F13;
  --good:#3EC181; --good-soft:#12251B;
  --gold:#F0B444; --gold-soft:#2B2214;
  --bad:#E86354; --bad-soft:#2C1917;
  --body-off:#2B313D; --ring-track:#252B35;
  --sh:0 1px 2px rgba(0,0,0,.5), 0 12px 28px -20px rgba(0,0,0,.9);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:inherit}
button{cursor:pointer;background:none;border:0;padding:0;color:inherit}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.app{max-width:600px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:center;gap:12px;padding:18px 2px 14px}
.head .hi{flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:12px;padding:2px;border-radius:14px;transition:transform .1s ease}
.brand:active{transform:scale(.97)}
.head .hi b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.head .hi span{font-size:13px;color:var(--ink-3);font-weight:500}
.mark{width:38px;height:38px;flex:none;border-radius:12px;display:block}

.sec{display:flex;align-items:center;gap:8px;margin:26px 2px 12px}
.sec h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:700}
.sec .more{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:600}

.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.stack{display:flex;flex-direction:column;gap:12px}

/* ---------- semana ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:7px}
.wd i{font-style:normal;font-size:10.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.wd b{width:100%;max-width:38px;aspect-ratio:1;border-radius:13px;background:var(--card-2);display:grid;place-items:center;
  font-size:13px;font-weight:700;color:var(--ink-3)}
.wd b.on{background:var(--accent);color:var(--accent-ink)}
.wd b.today{box-shadow:inset 0 0 0 2px var(--ink)}
.wd b.today.on{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 2px var(--card),0 0 0 4px var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi b small{font-size:12px;font-weight:600;color:var(--ink-3);margin-left:2px}
.kpi i{font-style:normal;font-size:11px;color:var(--ink-3);font-weight:600;display:block;margin-top:2px}

/* ---------- grilla de rutinas ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.tile .circ{width:100%;aspect-ratio:1;max-width:96px;border-radius:50%;background:var(--card);position:relative;
  display:grid;place-items:center;box-shadow:var(--sh);transition:transform .12s ease}
.tile:active .circ{transform:scale(.95)}
.tile .circ svg{width:62%;height:62%}
.tile .circ .badge{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;background:var(--accent);
  display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.tile .circ .badge svg{width:12px;height:12px;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tile em{font-style:normal;font-size:13px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.tile small{font-size:11px;color:var(--ink-3);font-weight:500}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;
  border-radius:15px;background:var(--card-2);font-weight:700;font-size:15px;transition:transform .1s ease}
.btn:active{transform:scale(.98)}
.btn-1{background:var(--accent);color:var(--accent-ink)}
.btn-line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2);color:var(--ink-2)}
.btn-bad{background:transparent;color:var(--bad)}
.btn-sm{min-height:38px;padding:0 13px;font-size:13px;border-radius:11px}
.btn-w{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;align-items:center;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sp{flex:1}

/* ---------- tabbar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);
  box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:600px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 0 9px;color:var(--ink-3);
  font-size:10.5px;font-weight:700;letter-spacing:.01em}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* ---------- preview de rutina ---------- */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:6px 0 4px}
.hero .circ{width:132px;height:132px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--sh);margin-bottom:14px}
.hero .circ svg{width:64%;height:64%}
.hero h1{font-size:26px;letter-spacing:-.035em}
.hero p{margin:0;font-size:14px;color:var(--ink-3);font-weight:500}
.plan{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line)}
.plan:last-child{border-bottom:0}
.plan .th{width:44px;height:44px;flex:none;border-radius:50%;background:var(--card-2);display:grid;place-items:center}
.plan .th svg{width:64%;height:64%}
.plan .tx{flex:1;min-width:0}
.plan .tx b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.plan .tx span{font-size:12.5px;color:var(--ink-3);font-weight:500}
.plan .rp{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 9px;border-radius:9px;white-space:nowrap}

/* ---------- sesión ---------- */
.sbar{position:sticky;top:0;z-index:30;background:var(--bg);padding:12px 0 10px;margin-bottom:6px}
.sbar .r1{display:flex;align-items:center;gap:11px}
.sbar h1{font-size:17px;letter-spacing:-.025em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconb{width:40px;height:40px;flex:none;border-radius:13px;background:var(--card);display:grid;place-items:center;box-shadow:var(--sh)}
.iconb svg{width:19px;height:19px;stroke:var(--ink-2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:7px;margin-top:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border-radius:11px;padding:6px 10px;
  font-size:12.5px;font-weight:700;box-shadow:var(--sh)}
.chip svg{width:13px;height:13px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip.live svg{stroke:var(--accent)}
.bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:11px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}

.ex{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px}
.ex-h{display:flex;align-items:center;gap:12px;padding:15px 16px 12px}
.ex-h .th{width:50px;height:50px;flex:none;border-radius:50%;background:var(--card-2);display:grid;place-items:center}
.ex-h .th svg{width:80%;height:80%}
.ex-h .tx{flex:1;min-width:0}
.ex-h .tx b{display:block;font-size:15px;font-weight:700;letter-spacing:-.015em;line-height:1.3}
.ex-h .tx span{font-size:12.5px;color:var(--ink-3);font-weight:500}
.ex-h .dots{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center}
.ex-h .dots svg{width:17px;height:17px;stroke:var(--ink-3);fill:none;stroke-width:2}

.sets{padding:0 16px 14px}
.sh,.sr{display:grid;grid-template-columns:24px 1fr 1fr 1fr 38px;gap:8px;align-items:center}
.sh{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:700;padding-bottom:8px}
.sh span:nth-child(3),.sh span:nth-child(4){text-align:center}
.sr{padding:5px 0;border-top:1px solid var(--line)}
.sn{font-size:13px;font-weight:700;color:var(--ink-3);text-align:center;position:relative}
.sn .pr{position:absolute;top:-8px;right:-6px;font-size:11px;color:var(--gold)}
.prev{font-size:13px;color:var(--accent);font-weight:600;background:none;text-align:left;padding:0 2px;white-space:nowrap;overflow:hidden}
.prev.none{color:var(--ink-3);font-weight:500}
.inp{width:100%;height:42px;border-radius:12px;background:var(--card-2);border:1.5px solid transparent;
  text-align:center;font-weight:700;font-size:16px;padding:0 2px;min-width:0}
.inp::placeholder{color:var(--ink-3);font-weight:500;opacity:.7}
.inp:focus{border-color:var(--accent);background:var(--card);outline:none}
.ck{width:38px;height:38px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;justify-self:end}
.ck svg{width:17px;height:17px;stroke:var(--ink-3);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.sr.ok .ck{background:var(--accent)}
.sr.ok .ck svg{stroke:var(--accent-ink)}
.sr.ok .inp{background:var(--accent-soft);color:var(--accent)}
.exops{display:flex;gap:8px;padding-top:10px}
.nt{width:100%;min-height:44px;border-radius:12px;background:var(--card-2);border:0;padding:11px 13px;font-size:13.5px;resize:vertical;margin-top:10px}

/* ---------- cronómetro de descanso ---------- */
.rest{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));z-index:39;
  display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.rest-in{pointer-events:auto;width:100%;max-width:568px;background:var(--card);border-radius:20px;
  box-shadow:0 4px 12px rgba(19,22,32,.10), 0 20px 40px -24px rgba(19,22,32,.5);
  display:flex;align-items:center;gap:9px;padding:11px 11px}
:root[data-theme="dark"] .rest-in,:root:not([data-theme="light"]) .rest-in{box-shadow:0 4px 30px rgba(0,0,0,.6)}
.ring{width:52px;height:52px;flex:none;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--ring-track);stroke-width:4}
.ring .prg{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .95s linear}
.ring .play{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.ring .play svg{position:static;transform:none;width:15px;height:15px;fill:var(--accent-ink);stroke:none;margin-left:3px}
.rest-t{flex:1;min-width:0;text-align:left;background:none;padding:0}
.rest-t i{font-style:normal;display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-t b{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2;border-bottom:1.5px dotted var(--line-2)}
.rest-in.run .rest-t b{border-bottom-color:transparent;color:var(--accent)}
.rbtn{height:36px;padding:0 11px;border-radius:11px;background:var(--card-2);font-size:12.5px;font-weight:700;color:var(--ink-2)}

/* ---------- historial ---------- */
.hrow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);
  border-radius:var(--r-sm);padding:13px 14px;box-shadow:var(--sh);margin-bottom:9px}
.hrow .th{width:44px;height:44px;flex:none;border-radius:50%;background:var(--card-2);display:grid;place-items:center}
.hrow .th svg{width:64%;height:64%}
.hrow .tx{flex:1;min-width:0}
.hrow .tx b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .tx span{font-size:12.5px;color:var(--ink-3);font-weight:500}
.hrow .dt{text-align:right;flex:none}
.hrow .dt b{display:block;font-size:14px;font-weight:700}
.hrow .dt span{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase}
.mh{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:700;margin:20px 2px 10px}

/* ---------- progreso ---------- */
.g2s{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st{background:var(--card);border-radius:18px;padding:15px 16px;box-shadow:var(--sh)}
.st .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px}
.st .ic svg{width:16px;height:16px;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.st i{font-style:normal;font-size:12px;color:var(--ink-3);font-weight:600;display:block}
.st b{display:block;font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.15;margin-top:1px}
.st b small{font-size:13px;font-weight:600;color:var(--ink-3)}
.st .dl{font-size:11.5px;font-weight:700;margin-top:3px;color:var(--ink-3)}
.st .dl.up{color:var(--good)} .st .dl.dn{color:var(--bad)}

.ch{background:var(--card);border-radius:var(--r);padding:18px 16px 14px;box-shadow:var(--sh)}
.ch h3{font-size:15px;letter-spacing:-.02em}
.ch .sub{font-size:12.5px;color:var(--ink-3);margin-top:3px;font-weight:500}
.cw{position:relative;margin-top:16px}
.cw svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--line);stroke-width:1}
.ax{font-size:10px;fill:var(--ink-3);font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 10px;
  font-size:11.5px;font-weight:600;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .12s;z-index:5}
.tip.on{opacity:1}
.mg{display:grid;grid-template-columns:88px 1fr 32px;gap:9px;align-items:center;margin-bottom:9px}
.mg .lb{font-size:12.5px;color:var(--ink-2);text-align:right;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgt{position:relative;height:18px;background:var(--card-2);border-radius:0 6px 6px 0}
.mgz{position:absolute;top:-2px;bottom:-2px;background:color-mix(in srgb,var(--good) 9%,transparent);
  border-left:1px dashed color-mix(in srgb,var(--good) 40%,transparent);border-right:1px dashed color-mix(in srgb,var(--good) 40%,transparent)}
.mgb{height:18px;border-radius:0 6px 6px 0;background:var(--accent);min-width:3px}
.mg .vl{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.sel{width:100%;height:46px;border-radius:14px;background:var(--card-2);border:0;padding:0 14px;font-size:14.5px;font-weight:600;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

/* ---------- hoja modal ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,12,18,.5);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.ov[hidden]{display:none}
.sheet{width:100%;max-width:600px;background:var(--bg);border-radius:26px 26px 0 0;max-height:92vh;display:flex;flex-direction:column;
  animation:up .24s cubic-bezier(.2,.85,.3,1)}
@keyframes up{from{transform:translateY(22px);opacity:.5}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;gap:12px;padding:18px 18px 12px}
.sh-h h3{flex:1;font-size:18px}
.sh-b{padding:4px 18px 18px;overflow:auto}
.sh-f{padding:12px 18px calc(18px + env(safe-area-inset-bottom));display:flex;gap:10px}
.fld{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.fld label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.fld input,.fld textarea{height:48px;border-radius:14px;background:var(--card);border:0;padding:0 14px;font-size:16px;font-weight:600;box-shadow:var(--sh)}
.fld textarea{height:auto;padding:12px 14px;min-height:76px;font-weight:500}
.fld .hlp{font-size:12.5px;color:var(--ink-3);font-weight:500;line-height:1.5}
.srch{width:100%;height:48px;border-radius:14px;background:var(--card);border:0;padding:0 14px;font-size:16px;box-shadow:var(--sh)}
.lib{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.li{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:10px 13px;box-shadow:var(--sh)}
.li .th{width:38px;height:38px;flex:none;border-radius:50%;background:var(--card-2);display:grid;place-items:center}
.li .th svg{width:64%;height:64%}
.li b{flex:1;font-size:14px;font-weight:700}
.li small{font-size:11.5px;color:var(--ink-3);font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}

<script type="module">
const CFG = window.RG_FIREBASE_CONFIG;
function ready(v){ window.RGCloud = v; window.dispatchEvent(new Event('rg-cloud-ready')); }
if (!CFG) { ready(null); }
else {
 try {
  const V = '10.12.2', B = 'https://www.gstatic.com/firebasejs/' + V + '/';
  const { initializeApp } = await import(B + 'firebase-app.js');
  const { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
          onAuthStateChanged, signOut } = await import(B + 'firebase-auth.js');
  const { getFirestore, doc, getDoc, setDoc, updateDoc, deleteField, arrayUnion, arrayRemove,
          initializeFirestore, persistentLocalCache, persistentMultipleTabManager } = await import(B + 'firebase-firestore.js');

  const app = initializeApp(CFG);
  const auth = getAuth(app);
  let db;
  try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
  catch (e) { db = getFirestore(app); }

  const uDoc = u => doc(db, 'users', u);
  const priv = u => doc(db, 'users', u, 'private', 'db');
  const pub  = u => doc(db, 'users', u, 'public', 'summary');

  /* Código corto e irrepetible para compartir con amigos. */
  function mkCode(){
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = '';
    for (let i = 0; i < 6; i++) s += A[Math.floor(Math.random() * A.length)];
    return s;
  }
  async function claimCode(uid){
    for (let i = 0; i < 6; i++) {
      const c = mkCode(), ref = doc(db, 'codes', c);
      const snap = await getDoc(ref);
      if (snap.exists()) continue;
      await setDoc(ref, { uid });
      return c;
    }
    return null;
  }
  async function ensureProfile(user){
    const ref = uDoc(user.uid), snap = await getDoc(ref);
    if (snap.exists()) {
      const d = snap.data();
      const patch = {};
      if (d.name !== user.displayName) patch.name = user.displayName || 'Sin nombre';
      if (d.photo !== user.photoURL) patch.photo = user.photoURL || '';
      if (Object.keys(patch).length) await updateDoc(ref, patch);
      return { uid: user.uid, ...d, ...patch };
    }
    const code = await claimCode(user.uid);
    const p = { name: user.displayName || 'Sin nombre', photo: user.photoURL || '',
                code: code || '', friends: [], requests: [], createdAt: Date.now() };
    await setDoc(ref, p);
    return { uid: user.uid, ...p };
  }

  try { await getRedirectResult(auth); } catch (e) {}

  ready({
    onUser(cb){ onAuthStateChanged(auth, async u => {
      if (!u) return cb(null);
      let p = null;
      try { p = await ensureProfile(u); } catch (e) { p = { uid: u.uid, name: u.displayName || '', photo: u.photoURL || '', code: '', friends: [], requests: [] }; }
      cb(p);
    }); },
    async signIn(){
      const prov = new GoogleAuthProvider();
      try { await signInWithPopup(auth, prov); }
      catch (e) {
        if (e && /popup|blocked|cancel/i.test(e.code || '')) { await signInWithRedirect(auth, prov); return; }
        throw e;
      }
    },
    signOut(){ return signOut(auth); },
    async loadDb(uid){ const s = await getDoc(priv(uid)); return s.exists() ? (s.data().json ? JSON.parse(s.data().json) : null) : null; },
    saveDb(uid, dbObj){ return setDoc(priv(uid), { json: JSON.stringify(dbObj), at: Date.now() }); },
    savePublic(uid, sum){ return setDoc(pub(uid), Object.assign({ at: Date.now() }, sum)); },
    async profile(uid){ const s = await getDoc(uDoc(uid)); return s.exists() ? { uid, ...s.data() } : null; },
    async byCode(code){
      const s = await getDoc(doc(db, 'codes', String(code).toUpperCase().trim()));
      return s.exists() ? s.data().uid : null;
    },
    /* Al agregar a alguien le doy acceso de lectura y le dejo la solicitud. */
    async addFriend(myUid, otherUid){
      await updateDoc(uDoc(myUid), { friends: arrayUnion(otherUid) });
      await updateDoc(uDoc(otherUid), { requests: arrayUnion(myUid) });
    },
    async accept(myUid, otherUid){
      await updateDoc(uDoc(myUid), { friends: arrayUnion(otherUid), requests: arrayRemove(otherUid) });
    },
    async reject(myUid, otherUid){ await updateDoc(uDoc(myUid), { requests: arrayRemove(otherUid) }); },
    async remove(myUid, otherUid){ await updateDoc(uDoc(myUid), { friends: arrayRemove(otherUid) }); },
    async summary(uid){ const s = await getDoc(pub(uid)); return s.exists() ? s.data() : null; }
  });
 } catch (e) { console.warn('Nube no disponible:', e); ready(null); }
}
</script>

/* ====================== utilidades ====================== */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){if(v===''||v==null)return null;var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null;}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function pl(n,s,p){return n+' '+(n===1?s:p);}
function e1rm(w,r){return w*(1+r/30);}
function pad(n){return n<10?'0'+n:''+n;}
function fmtW(n){if(n==null)return '';return (Math.round(n*10)/10).toString().replace('.',',');}
function clk(ms){var s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  return (h>0?h+':'+pad(m):m)+':'+pad(s%60);}
function dur(ms){var s=Math.max(0,Math.round(ms/1000));
  if(s<60)return s+' s';
  var h=Math.floor(s/3600),m=Math.round(s%3600/60);
  if(h>0)return h+' h '+pad(m)+' min';return m+' min';}
function durS(ms){var s=Math.max(0,Math.round(ms/1000));
  if(s<60)return s+'s';
  var h=Math.floor(s/3600),m=Math.round(s%3600/60);
  if(h>0)return h+'h '+pad(m)+'m';return m+'m';}
var DAYS=['L','M','M','J','V','S','D'];
var MON=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MONS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function dayStart(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function weekStart(t){var d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}
function rel(t){var d=Math.round((dayStart(Date.now())-dayStart(t))/86400000);
  if(d===0)return 'hoy';if(d===1)return 'ayer';if(d<7)return 'hace '+d+' días';
  if(d<14)return 'hace 1 semana';if(d<60)return 'hace '+Math.round(d/7)+' semanas';return 'hace '+Math.round(d/30)+' meses';}

/* ====================== cálculos ====================== */
function setW(e,s){var w=num(s.w),v=(w==null?0:w);return e.bw?((state.db.settings.bodyweight||0)+v):v;}
function stats(s){var sets=0,reps=0,exs=0;
  (s.entries||[]).forEach(function(e){var any=0;
    (e.sets||[]).forEach(function(x){if(!x.done)return;any=1;sets++;reps+=num(x.r)||0;});
    if(any)exs++;});
  var total=(s.end||Date.now())-s.start,rest=s.restMs||0;
  return {sets:sets,reps:reps,exs:exs,total:total,rest:rest,work:Math.max(0,total-rest)};}
function done(){return (state.db.sessions||[]).filter(function(s){return s.end;});}
function best(name,before){var v=0,rec=null;
  done().forEach(function(s){if(before&&s.start>=before)return;
    (s.entries||[]).forEach(function(e){if(e.name!==name)return;
      (e.sets||[]).forEach(function(x){if(!x.done)return;var r=num(x.r);if(!r)return;
        var q=e1rm(setW(e,x),r);if(q>v){v=q;rec={w:setW(e,x),r:r,ts:s.start};}});});});
  return {value:v,rec:rec};}
function lastPerf(name,skip){
  var l=done().slice().sort(function(a,b){return b.start-a.start;});
  for(var i=0;i<l.length;i++){if(skip&&l[i].id===skip)continue;
    var e=(l[i].entries||[]).filter(function(x){return x.name===name;})[0];
    if(e){var d=(e.sets||[]).filter(function(x){return x.done;});if(d.length)return{sets:d,ts:l[i].start};}}
  return null;}
function wAgg(ws){var sets=0,count=0,pm={},days={},t=0,r=0;
  done().forEach(function(s){if(weekStart(s.start)!==ws)return;
    count++;days[dayStart(s.start)]=1;var st=stats(s);t+=st.total;r+=st.rest;
    (s.entries||[]).forEach(function(e){(e.sets||[]).forEach(function(x){
      if(!x.done)return;sets++;pm[e.muscle]=(pm[e.muscle]||0)+1;});});});
  return {sets:sets,count:count,perMuscle:pm,days:days,total:t,rest:r};}
function wProg(ws){var b={};
  done().forEach(function(s){if(weekStart(s.start)!==ws)return;
    (s.entries||[]).forEach(function(e){(e.sets||[]).forEach(function(x){
      if(!x.done)return;var r=num(x.r);if(!r)return;var q=e1rm(setW(e,x),r);
      if(!b[e.name]||q>b[e.name])b[e.name]=q;});});});
  var imp=0,tot=0;
  Object.keys(b).forEach(function(n){var pv=best(n,ws).value;if(pv<=0)return;tot++;if(b[n]>pv*1.0001)imp++;});
  return {improved:imp,total:tot};}
function routineMuscles(r){
  var c={};(r.ex||r.entries||[]).forEach(function(e){c[e.muscle]=(c[e.muscle]||0)+1;});
  return Object.keys(c).sort(function(a,b){return c[b]-c[a];});}

/* ---------- sincronización ---------- */
function mergeDb(a,b){
  if(!a)return b;if(!b)return a;
  var del={};(a.deleted||[]).concat(b.deleted||[]).forEach(function(x){del[x]=1;});
  var map={};(a.sessions||[]).concat(b.sessions||[]).forEach(function(s){
    if(!s||!s.id||del[s.id])return;var p=map[s.id];
    if(!p||(s.updatedAt||0)>=(p.updatedAt||0))map[s.id]=s;});
  var nr=(b.routinesAt||0)>(a.routinesAt||0)?b:a;
  var ns=(b.settingsAt||0)>(a.settingsAt||0)?b:a;
  return {v:1,routines:nr.routines||seedRoutines(),routinesAt:nr.routinesAt||0,
    sessions:Object.keys(map).map(function(k){return map[k];}).sort(function(x,y){return x.start-y.start;}),
    deleted:Object.keys(del),
    settings:Object.assign({rest:120,bodyweight:75,sound:true,theme:'auto'},ns.settings||{}),
    settingsAt:ns.settingsAt||0};
}
function buildSummary(){
  var ws=weekStart(Date.now()),a=wAgg(ws),p=wProg(ws);
  return {
    name:state.user?state.user.name:'',photo:state.user?state.user.photo:'',
    week:{sets:a.sets,count:a.count,improved:p.improved,total:p.total},
    recent:done().slice().sort(function(x,y){return y.start-x.start;}).slice(0,8).map(function(s){
      var st=stats(s);return {name:s.name,start:s.start,sets:st.sets,total:st.total};}),
    prs:exNames().map(function(n){var b=best(n);
      return {n:n,v:Math.round(b.value*10)/10,w:b.rec?b.rec.w:0,r:b.rec?b.rec.r:0};})
      .filter(function(x){return x.v>0;}).sort(function(x,y){return y.v-x.v;}).slice(0,12)
  };
}

  if(!state.cloud||!state.user)return;

    if(remote){state.db=mergeDb(remote,state.db);saveDb();}
    pushCloud();
    if(state.view!=='sesion')render();
  }).catch(function(){});
  loadFriends();
}
function loadFriends(){
  var u=state.user;if(!u||!state.cloud)return;
  var ids=(u.friends||[]).concat(u.requests||[]);
  ids.forEach(function(uid){
    if(!state.people[uid])state.cloud.profile(uid).then(function(p){
      if(p){state.people[uid]=p;if(state.view==='amigos')render();}}).catch(function(){});
    if((u.friends||[]).indexOf(uid)>=0&&!state.sums[uid])
      state.cloud.summary(uid).then(function(s){
        if(s){state.sums[uid]=s;if(state.view==='amigos')render();}}).catch(function(){});
  });
}

    '<input class="inp" type="text" inputmode="numeric" data-a="sr" data-i="'+i+'" data-j="'+j+'" value="'+esc(s.r)+'" placeholder="'+(p?(num(p.r)||''):e.target.rmin)+'" aria-label="Reps serie '+(j+1)+'">'+

function toggle(i,j){
  var e=state.active.entries[i],s=e.sets[j];
  if(!s.done){
    if(s.w===''&&s.r===''){
      var row=$('.sr[data-i="'+i+'"][data-j="'+j+'"]');
      var wi=$('[data-a="sw"]',row),ri=$('[data-a="sr"]',row);
      if(wi&&wi.placeholder&&wi.placeholder!=='kg')s.w=wi.placeholder;
      if(ri&&ri.placeholder)s.r=ri.placeholder;
    }
    if(num(s.r)==null){toast('Falta cargar las repeticiones');return;}
    var bf=best(e.name,state.active.editing?state.active.start:null).value;
    s.done=true;s.ts=Date.now();
    s.pr=(bf>0&&e1rm(setW(e,s),num(s.r))>bf*1.0001);
    var nx=e.sets[j+1];
    if(nx&&!nx.done&&nx.w===''&&nx.r===''){nx.w=s.w;nx.r=s.r;}
    if(s.pr&&!state.active.editing)toast('¡Récord en '+e.name+'!');
  }else{s.done=false;s.pr=false;}
  saveAc();redraw(i);refreshBar();
}

/* ---------- cronómetro ---------- */
function restDef(){return state.db.settings.rest||120;}
function startRest(){
  var d=restDef();
  state.rest={end:Date.now()+d*1000,total:d,from:Date.now()};saveRs();renderRest();
  clearInterval(state.restT);state.restT=setInterval(tickRest,250);
}
function tickRest(){if(!state.rest)return;if(Date.now()>=state.rest.end)endRest(true);else renderRest();}
function endRest(beep){
  if(state.rest&&state.active){
    state.active.restMs=(state.active.restMs||0)+(Date.now()-state.rest.from);
    saveAc();
  }
  clearInterval(state.restT);state.rest=null;saveRs();renderRest();
  if(state.view==='sesion'){var r=$('#cRest');if(r&&state.active)r.textContent='Descanso '+clk(stats(state.active).rest);}
  if(beep){vib();chime();}
}
function setRestDef(v){
  state.db.settings.rest=clamp(Math.round(v/5)*5,15,1800);
  state.db.settingsAt=Date.now();saveDb();renderRest();
  if(state.view==='ajustes')render();
}
function renderRest(){
  var el=$('#rest');
  if(state.view!=='sesion'||!state.active){if(el)el.remove();return;}
  var R=22,C=2*Math.PI*R,html;
  if(state.rest){
    var left=Math.max(0,state.rest.end-Date.now()),f=left/(state.rest.total*1000);
    html='<div class="rest" id="rest"><div class="rest-in run">'+
      '<span class="ring"><svg viewBox="0 0 52 52"><circle class="trk" cx="26" cy="26" r="'+R+'"/>'+
      '<circle class="prg" cx="26" cy="26" r="'+R+'" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+((1-f)*C).toFixed(1)+'"/></svg></span>'+
      '<span class="rest-t"><i>Descanso</i><b>'+clk(left)+'</b></span>'+
      '<button class="rbtn" data-a="r-">−15</button><button class="rbtn" data-a="r+">+15</button>'+
      '<button class="rbtn" data-a="rstop" style="background:var(--accent);color:var(--accent-ink)">Listo</button></div></div>';
  }else{
    html='<div class="rest" id="rest"><div class="rest-in">'+
      '<button class="ring" data-a="rplay" aria-label="Empezar el descanso"><span class="play">'+I.play+'</span></button>'+
      '<button class="rest-t" data-a="redit" aria-label="Cambiar el tiempo"><i>Descanso</i><b>'+clk(restDef()*1000)+'</b></button>'+
      '<button class="rbtn" data-a="rd-">−15s</button><button class="rbtn" data-a="rd+">+15s</button></div></div>';
  }
  if(el)el.outerHTML=html;else document.body.insertAdjacentHTML('beforeend',html);
}
function vib(){try{if(navigator.vibrate)navigator.vibrate([120,70,120]);}catch(e){}}
var actx;
function chime(){
  if(!state.db.settings.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    [0,.16].forEach(function(o,k){var s=actx.createOscillator(),g=actx.createGain();
      s.type='sine';s.frequency.value=k?1046:784;
      g.gain.setValueAtTime(.0001,actx.currentTime+o);
      g.gain.exponentialRampToValueAtTime(.2,actx.currentTime+o+.02);
      g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+o+.28);
      s.connect(g);g.connect(actx.destination);s.start(actx.currentTime+o);s.stop(actx.currentTime+o+.3);});
  }catch(e){}
}
var rEdit=0;
function openRest(){rEdit=restDef();drawRest();}
function drawRest(){
  var m=Math.floor(rEdit/60),s=rEdit%60,chips=[45,60,90,120,150,180,240,300];
  sheet('Tiempo de descanso',
    '<div style="text-align:center;padding:4px 0 18px"><div class="big">'+clk(rEdit*1000)+'</div>'+
    '<div style="font-size:12px;color:var(--ink-3);font-weight:600;margin-top:6px">minutos : segundos</div></div>'+
    '<div class="g2" style="margin-bottom:16px"><button class="btn" data-a="re-">− 15s</button><button class="btn" data-a="re+">+ 15s</button></div>'+
    '<div class="fld"><label>Valores rápidos</label><div class="pillrow">'+
    chips.map(function(c){return '<button class="btn btn-sm'+(c===rEdit?' btn-1':'')+'" data-a="rqk" data-v="'+c+'">'+clk(c*1000)+'</button>';}).join('')+
    '</div></div><div class="g2"><div class="fld"><label>Minutos</label><input type="text" inputmode="numeric" data-a="rmin" value="'+m+'"></div>'+
    '<div class="fld"><label>Segundos</label><input type="text" inputmode="numeric" data-a="rsec" value="'+pad(s)+'"></div></div>'+
    '<p style="margin:0;font-size:12.5px;color:var(--ink-3);font-weight:500;line-height:1.5">Queda guardado para la próxima. El cronómetro no arranca solo.</p>',
    '<button class="btn btn-w" data-a="close">Cancelar</button><button class="btn btn-1 btn-w" data-a="rsave">Guardar</button>');
}

/* ---------- terminar ---------- */
function finish(){
  var a=state.active,st=stats(a);
  if(!st.sets){
    sheet('Sin series','<p style="margin:0;color:var(--ink-2)">No marcaste ninguna serie. ¿Descartás el entrenamiento?</p>',
      '<button class="btn btn-w" data-a="close">Seguir</button><button class="btn btn-bad btn-w" data-a="discard">Descartar</button>');
    return;
  }
  if(state.rest)endRest(false);
  st=stats(a);
  var prs=[];a.entries.forEach(function(e){e.sets.forEach(function(s){if(s.done&&s.pr)prs.push(e.name);});});
  var b='<div style="text-align:center;padding:2px 0 18px"><div class="big">'+dur(st.total)+'</div>'+
    '<div style="font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:700;margin-top:6px">Duración total</div></div>'+
    '<div class="g2s" style="margin-bottom:16px">'+
    '<div class="st"><i>Entrenando</i><b>'+durS(st.work)+'</b></div>'+
    '<div class="st"><i>Descansando</i><b>'+durS(st.rest)+'</b></div></div>'+
    '<div class="card">'+kv('Series completadas',st.sets)+kv('Ejercicios',st.exs)+kv('Repeticiones',st.reps)+
    (prs.length?kv('Ejercicios donde mejoraste',prs.length):'')+'</div>'+
    (prs.length?'<div class="card" style="margin-top:12px;background:var(--gold-soft)"><b style="font-size:13.5px">Superaste tu marca en:</b>'+
      '<div style="font-size:13.5px;color:var(--ink-2);margin-top:4px">'+prs.map(esc).join(', ')+'</div></div>':'');
  sheet(a.editing?'Guardar cambios':'¡Entrenamiento terminado!',b,
    '<button class="btn btn-w" data-a="close">Volver</button><button class="btn btn-1 btn-w" data-a="save">Guardar</button>');
}
function kv(k,v){return '<div class="kv"><span>'+k+'</span><b>'+v+'</b></div>';}
function save(){
  var a=state.active;
  a.entries.forEach(function(e){e.sets=e.sets.filter(function(s,i){return s.done||i<e.target.sets;});});
  a.updatedAt=Date.now();
  if(a.editing){delete a.editing;state.db.sessions=state.db.sessions.map(function(s){return s.id===a.id?a:s;});}
  else{a.end=Date.now();state.db.sessions.push(a);}
  state.active=null;saveAc();saveDb();closeSheet();
  state.view='historial';render();toast('Entrenamiento guardado');
}

/* ---------- historial ---------- */
function vHistorial(){
  var l=done().slice().sort(function(a,b){return b.start-a.start;});
  if(!l.length)return '<div class="empty"><b>Todavía no hay entrenamientos</b><p>Elegí una rutina en Inicio y empezá el primero.</p></div>';
  var h='',lm='';
  l.forEach(function(s){
    var d=new Date(s.start),k=d.getFullYear()+'-'+d.getMonth();
    if(k!==lm){lm=k;h+='<div class="mh">'+MON[d.getMonth()]+' '+d.getFullYear()+'</div>';}
    var st=stats(s);
    h+='<button class="hrow" data-a="sess" data-id="'+s.id+'">'+
      '<span class="th">'+bodySVG(routineMuscles(s),s.routineId)+'</span>'+
      '<span class="tx"><b>'+esc(s.name)+'</b><span>'+pl(st.sets,'serie','series')+' · '+durS(st.total)+'</span></span>'+
      '<span class="dt"><b>'+d.getDate()+'</b><span>'+MONS[d.getMonth()]+'</span></span></button>';
  });
  return h;
}
function openSess(id){

function tile(k,v,suf,ic,col,bg,delta,sub){
  var d='';

  else if(sub)d='<div class="dl">'+sub+'</div>';

    '<i>'+k+'</i><b>'+v+(suf?'<small>'+suf+'</small>':'')+'</b>'+d+'</div>';

function chWeeks(){
  var n=8,ws=weekStart(Date.now()),d=[];
  for(var i=n-1;i>=0;i--){var w=ws-i*604800000;d.push({w:w,a:wAgg(w)});}
  var mx=Math.max.apply(null,d.map(function(x){return x.a.sets;}).concat([1]));
  var W=320,H=130,P=4,bw=(W-P*2)/n,iw=bw-10,bars='',lb='',gr='';
  [.33,.66,1].forEach(function(f){var y=H-H*f;gr+='<line class="gl" x1="0" y1="'+y.toFixed(1)+'" x2="'+W+'" y2="'+y.toFixed(1)+'"/>';});
  d.forEach(function(x,i){
    var hh=x.a.sets/mx*(H-8),bx=P+i*bw+5,by=H-hh,last=i===n-1,r=Math.min(6,iw/2,hh);
    if(hh>0)bars+='<path d="M'+bx+' '+H+' L'+bx+' '+(by+r)+' Q'+bx+' '+by+' '+(bx+r)+' '+by+' L'+(bx+iw-r)+' '+by+' Q'+(bx+iw)+' '+by+' '+(bx+iw)+' '+(by+r)+' L'+(bx+iw)+' '+H+' Z" fill="var(--accent)"'+(last?'':' opacity=".26"')+'/>';
    bars+='<rect x="'+(P+i*bw)+'" y="0" width="'+bw+'" height="'+H+'" fill="transparent" data-t="'+esc(wLabel(x.w)+' · '+pl(x.a.sets,'serie','series'))+'" data-x="'+(bx+iw/2)+'" data-y="'+by+'"/>';
    if(i%2===1||last)lb+='<text class="ax" x="'+(bx+iw/2)+'" y="'+(H+15)+'" text-anchor="middle">'+new Date(x.w).getDate()+'/'+(new Date(x.w).getMonth()+1)+'</text>';
  });
  var l=d[n-1].a;
  return '<div class="ch"><h3>Últimas 8 semanas</h3><div class="sub">Esta semana llevás '+pl(l.sets,'serie','series')+'</div>'+
    '<div class="cw" data-c="w"><svg viewBox="0 -8 '+W+' '+(H+24)+'" role="img" aria-label="Series por semana">'+gr+bars+lb+'</svg><div class="tip"></div></div></div>';
}
function wLabel(w){var a=new Date(w),b=new Date(w+518400000);
  return a.getDate()+' '+MONS[a.getMonth()]+' – '+b.getDate()+' '+MONS[b.getMonth()];}
function chMuscles(pm){
  var rows=MUS_ORDER.filter(function(m){return pm[m];}).sort(function(a,b){return pm[b]-pm[a];});
  if(!rows.length)return '<div class="ch"><h3>Series por músculo</h3><div class="sub">Sin series esta semana.</div></div>';
  var mx=Math.max(20,Math.max.apply(null,rows.map(function(m){return pm[m];})));
  var h='<div class="ch"><h3>Series por grupo muscular</h3><div class="sub">La zona sombreada es 10 a 20 series semanales, el rango habitual para hipertrofia.</div><div style="margin-top:16px">';
  h+=rows.map(function(m){
    return '<div class="mg"><div class="lb">'+MUS[m]+'</div>'+
      '<div class="mgt"><div class="mgz" style="left:'+(10/mx*100)+'%;width:'+((20-10)/mx*100)+'%"></div>'+
      '<div class="mgb" style="width:'+(pm[m]/mx*100)+'%"></div></div><div class="vl">'+pm[m]+'</div></div>';
  }).join('')+'</div></div>';

}
function exSeries(n){
  var p=[];
  done().slice().sort(function(a,b){return a.start-b.start;}).forEach(function(s){
    var v=0,w=0,r=0;
    (s.entries||[]).forEach(function(e){if(e.name!==n)return;
      (e.sets||[]).forEach(function(x){if(!x.done)return;var rr=num(x.r);if(!rr)return;
        var q=e1rm(setW(e,x),rr);if(q>v){v=q;w=setW(e,x);r=rr;}});});
    if(v>0)p.push({ts:s.start,v:v,w:w,r:r});});
  return p;
}
function exNames(){
  var seen={},o=[];
  done().forEach(function(s){(s.entries||[]).forEach(function(e){
    if(!seen[e.name]&&(e.sets||[]).some(function(x){return x.done;})){seen[e.name]=1;o.push(e.name);}});});
  return o.sort(function(a,b){return a.localeCompare(b,'es');});
}
function chEx(){
  var names=exNames();
  if(!names.length)return '';
  if(!state.progEx||names.indexOf(state.progEx)<0){
    var rk=names.map(function(n){var s=exSeries(n);
      return {n:n,c:s.length,t:s.reduce(function(m,p){return Math.max(m,p.v);},0)};})
      .sort(function(a,b){return (b.c-a.c)||(b.t-a.t);});
    state.progEx=(rk[0]&&rk[0].n)||names[0];
  }
  var p=exSeries(state.progEx);
  var h='<div class="ch"><h3>Progresión por ejercicio</h3><div class="sub">Mejor serie de cada día como 1RM estimado.</div>'+
    '<select class="sel" data-a="pickex" style="margin-top:14px" aria-label="Elegir ejercicio">'+
    names.map(function(n){return '<option value="'+esc(n)+'"'+(n===state.progEx?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select>';
  if(p.length<2)return h+'<div class="sub" style="margin-top:14px">Necesitás al menos 2 días de este ejercicio.</div></div>';
  var W=320,H=140,PL=30,PR=8,PT=12,PB=20;
  var vs=p.map(function(x){return x.v;}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  var sp=Math.max(mx-mn,mx*.08,1),lo=Math.max(0,mn-sp*.3),hi=mx+sp*.3;
  var t0=p[0].ts,t1=p[p.length-1].ts,ts=Math.max(t1-t0,1);
  function X(t){return PL+(t-t0)/ts*(W-PL-PR);}
  function Y(v){return PT+(1-(v-lo)/(hi-lo))*(H-PT-PB);}
  var gr='';[lo,(lo+hi)/2,hi].forEach(function(v){var y=Y(v);
    gr+='<line class="gl" x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'"/>'+
      '<text class="ax" x="'+(PL-7)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+Math.round(v)+'</text>';});
  var d=p.map(function(x,i){return (i?'L':'M')+X(x.ts).toFixed(1)+' '+Y(x.v).toFixed(1);}).join(' ');
  var ar=d+' L'+X(t1).toFixed(1)+' '+(H-PB)+' L'+X(t0).toFixed(1)+' '+(H-PB)+' Z';
  var dots=p.map(function(x,i){var l=i===p.length-1;
    return '<circle cx="'+X(x.ts).toFixed(1)+'" cy="'+Y(x.v).toFixed(1)+'" r="'+(l?5.5:4)+'" fill="'+(l?'var(--accent)':'var(--card)')+'" stroke="var(--accent)" stroke-width="2.2"/>';}).join('');
  var hits=p.map(function(x){
    return '<rect x="'+(X(x.ts)-14).toFixed(1)+'" y="'+PT+'" width="28" height="'+(H-PT-PB)+'" fill="transparent" data-t="'+
      esc(new Date(x.ts).getDate()+' '+MONS[new Date(x.ts).getMonth()]+' · '+x.r+' × '+fmtW(x.w)+' kg → '+fmtW(x.v)+' est.')+
      '" data-x="'+X(x.ts).toFixed(1)+'" data-y="'+Y(x.v).toFixed(1)+'"/>';}).join('');
  var ch=Math.round((p[p.length-1].v-p[0].v)/Math.max(p[0].v,1)*100);
  h+='<div class="cw" data-c="e"><svg viewBox="0 0 '+W+' '+(H+4)+'" role="img" aria-label="Progresión de '+esc(state.progEx)+'">'+
    gr+'<path d="'+ar+'" fill="var(--accent)" opacity=".08"/>'+
    '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+hits+'</svg><div class="tip"></div></div>'+
    '<div class="row" style="margin-top:12px;font-size:13px;font-weight:600"><span>'+fmtW(p[p.length-1].v)+' kg est.</span>'+
    '<span style="color:'+(ch>=0?'var(--good)':'var(--bad)')+';font-weight:700">'+(ch>=0?'+':'')+ch+'%</span>'+
    '<span class="sp"></span><span style="color:var(--ink-3)">desde '+new Date(t0).getDate()+' '+MONS[new Date(t0).getMonth()]+'</span></div></div>';
  return h;
}
function chPR(){

    '<div style="margin-top:12px">'+rows.map(function(x){

function hookCharts(){
  $$('.cw').forEach(function(w){
    var tip=$('.tip',w),svg=$('svg',w);if(!tip||!svg)return;
    function show(ev){
      var t=ev.target;
      if(!t||!t.getAttribute||!t.getAttribute('data-t')){tip.classList.remove('on');return;}
      var rc=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
      var sx=rc.width/vb.width,sy=rc.height/vb.height;
      tip.textContent=t.getAttribute('data-t');
      tip.style.left=clamp((parseFloat(t.getAttribute('data-x'))-vb.x)*sx,66,rc.width-66)+'px';
      tip.style.top=((parseFloat(t.getAttribute('data-y'))-vb.y)*sy)+'px';
      tip.classList.add('on');
    }
    w.addEventListener('pointermove',show);w.addEventListener('pointerdown',show);
    w.addEventListener('pointerleave',function(){tip.classList.remove('on');});
  });
}

}

/* ---------- hoja ---------- */
function sheet(t,b,f){
  var o=$('#ov');
  o.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="sh-h"><h3>'+t+'</h3>'+
    '<button class="iconb" data-a="close" aria-label="Cerrar">'+I.x+'</button></div>'+
    '<div class="sh-b">'+b+'</div>'+(f?'<div class="sh-f">'+f+'</div>':'')+'</div>';
  o.hidden=false;document.body.style.overflow='hidden';
}
function closeSheet(){var o=$('#ov');o.hidden=true;o.innerHTML='';document.body.style.overflow='';}

/* ---------- copias ---------- */
function doExport(){
  var j=JSON.stringify(state.db,null,2),n='rom-gym-'+new Date().toISOString().slice(0,10)+'.json';
  try{var b=new Blob([j],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=n;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(u);a.remove();},500);toast('Copia descargada');
  }catch(e){toast('No se pudo descargar');}
}
function doImport(){
  var i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.addEventListener('change',function(){
    var f=i.files&&i.files[0];if(!f)return;var fr=new FileReader();
    fr.onload=function(){try{var d=JSON.parse(fr.result);if(!d||!d.v)throw 0;
      var del={};(state.db.deleted||[]).concat(d.deleted||[]).forEach(function(x){del[x]=1;});
      var map={};(state.db.sessions||[]).concat(d.sessions||[]).forEach(function(s){
        if(!s||!s.id||del[s.id])return;var p=map[s.id];
        if(!p||(s.updatedAt||0)>=(p.updatedAt||0))map[s.id]=s;});
      state.db.sessions=Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return a.start-b.start;});
      state.db.deleted=Object.keys(del);
      if((d.routinesAt||0)>(state.db.routinesAt||0)){state.db.routines=d.routines;state.db.routinesAt=d.routinesAt;}
      saveDb();render();toast('Datos restaurados');
    }catch(e){toast('El archivo no es una copia válida');}};
    fr.readAsText(f);});
  i.click();
}

/* ====================== eventos ====================== */
function theme(){
  var t=state.db.settings.theme;
  if(t==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
}
document.addEventListener('click',function(ev){
  var t=ev.target.closest?ev.target.closest('[data-a]'):null;if(!t)return;
  var a=t.getAttribute('data-a'),i=+t.getAttribute('data-i'),j=+t.getAttribute('data-j'),id=t.getAttribute('data-id');
  switch(a){
    case 'tab': state.view=t.getAttribute('data-v');render();break;
    case 'home': state.view='inicio';render();break;
    case 'amigos': state.view='amigos';render();break;
    case 'nologin': state.hideLogin=true;try{localStorage.setItem(LS_NL,'1');}catch(e){}render();break;
    case 'signin': state.cloud&&state.cloud.signIn().catch(function(e){toast('No se pudo entrar');});break;
    case 'signout': state.cloud&&state.cloud.signOut().then(function(){
      state.user=null;state.uidPrevio='';
      try{localStorage.removeItem(LS_UID);}catch(e){}
      render();toast('Sesión cerrada');});break;
    case 'copycode': {
      var c=state.user&&state.user.code||'';
      try{navigator.clipboard.writeText(c);toast('Código copiado: '+c);}catch(e){toast('Tu código es '+c);}
      break;
    }
    case 'addfriend': {
      var inp=$('#fcode'),code=(inp&&inp.value||'').toUpperCase().trim();
      if(!code){toast('Escribí el código');break;}
      if(code===(state.user.code||'')){toast('Ese es tu propio código');break;}
      state.cloud.byCode(code).then(function(uid){
        if(!uid){toast('No existe ese código');return;}
        if((state.user.friends||[]).indexOf(uid)>=0){toast('Ya lo tenés agregado');return;}
        return state.cloud.addFriend(state.user.uid,uid).then(function(){
          state.user.friends=(state.user.friends||[]).concat([uid]);
          loadFriends();render();toast('Amigo agregado');
        });
      }).catch(function(){toast('No se pudo agregar');});
      break;
    }
    case 'accept': {
      state.cloud.accept(state.user.uid,id).then(function(){
        state.user.friends=(state.user.friends||[]).concat([id]);
        state.user.requests=(state.user.requests||[]).filter(function(x){return x!==id;});
        loadFriends();render();toast('Ahora se siguen');
      }).catch(function(){toast('No se pudo aceptar');});
      break;
    }
    case 'reject': {
      state.cloud.reject(state.user.uid,id).then(function(){
        state.user.requests=(state.user.requests||[]).filter(function(x){return x!==id;});
        render();
      }).catch(function(){});
      break;
    }
    case 'friend': openFriend(id);break;
    case 'unfriend': {
      state.cloud.remove(state.user.uid,id).then(function(){
        state.user.friends=(state.user.friends||[]).filter(function(x){return x!==id;});
        closeSheet();render();toast('Amigo quitado');
      }).catch(function(){});
      break;
    }
    case 'preview': state.preview=id;state.view='preview';render();break;
    case 'resume': state.view='sesion';render();break;
    case 'start': {
      var r=state.db.routines.filter(function(x){return x.id===id;})[0];if(!r)break;
      state.active={id:uid(),routineId:r.id,name:r.name,start:Date.now(),end:null,note:'',restMs:0,
        entries:r.ex.map(newEntry)};
      saveAc();state.view='sesion';render();toast('¡A entrenar!');break;
    }
    case 'free': {
      state.active={id:uid(),routineId:null,name:'Entrenamiento libre',start:Date.now(),end:null,note:'',restMs:0,entries:[]};
      saveAc();state.view='sesion';render();openLib();break;
    }
    case 'done': ev.preventDefault();toggle(i,j);break;
    case 'useprev': {
      var e=state.active.entries[i];e.sets[j].w=t.getAttribute('data-w');e.sets[j].r=t.getAttribute('data-r');
      saveAc();redraw(i);break;
    }
    case 'adds': state.active.entries[i].sets.push({w:'',r:'',done:false});saveAc();redraw(i);refreshBar();break;
    case 'dels': {var e2=state.active.entries[i];if(e2.sets.length>1)e2.sets.pop();saveAc();redraw(i);refreshBar();break;}
    case 'tnote': state.active.entries[i].noteOpen=!state.active.entries[i].noteOpen;redraw(i);break;
    case 'exmenu': {
      var em=state.active.entries[i];
      sheet(esc(em.name),'<div class="stack"><button class="btn btn-w" data-a="exup" data-i="'+i+'">Subir</button>'+
        '<button class="btn btn-w" data-a="exdn" data-i="'+i+'">Bajar</button>'+
        '<button class="btn btn-bad btn-w" data-a="exrm" data-i="'+i+'">Quitar del entrenamiento</button></div>',
        '<button class="btn btn-w" data-a="close">Cerrar</button>');break;
    }
    case 'exup': if(i>0){var A=state.active.entries;A.splice(i-1,0,A.splice(i,1)[0]);saveAc();closeSheet();render();}break;
    case 'exdn': {var B=state.active.entries;if(i<B.length-1){B.splice(i+1,0,B.splice(i,1)[0]);saveAc();closeSheet();render();}break;}
    case 'exrm': state.active.entries.splice(i,1);saveAc();closeSheet();render();break;
    case 'addex': openLib();break;
    case 'lpick': {
      state.active.entries.push(newEntry({name:t.getAttribute('data-n'),muscle:t.getAttribute('data-m'),
        sets:3,rmin:8,rmax:12,bw:t.getAttribute('data-bw')==='1',uni:t.getAttribute('data-u')==='1'}));
      saveAc();closeSheet();render();break;
    }
    case 'finish': finish();break;
    case 'save': save();break;
    case 'discard-ask': {
      var ed=state.active&&state.active.editing;
      sheet(ed?'Cancelar edición':'Descartar entrenamiento',
        '<p style="margin:0;color:var(--ink-2)">'+(ed?'Se pierden los cambios.':'Se pierde todo lo que registraste. No se puede deshacer.')+'</p>',
        '<button class="btn btn-w" data-a="close">Volver</button><button class="btn btn-bad btn-w" data-a="discard">'+(ed?'Cancelar cambios':'Descartar')+'</button>');
      break;
    }
    case 'discard': state.active=null;saveAc();closeSheet();endRest(false);state.view='inicio';render();toast('Descartado');break;
    case 'close': closeSheet();break;
    case 'rplay': startRest();break;
    case 'redit': openRest();break;
    case 'rd-': setRestDef(restDef()-15);break;
    case 'rd+': setRestDef(restDef()+15);break;
    case 're-': rEdit=clamp(rEdit-15,15,1800);drawRest();break;
    case 're+': rEdit=clamp(rEdit+15,15,1800);drawRest();break;
    case 'rqk': rEdit=+t.getAttribute('data-v');drawRest();break;
    case 'rsave': {
      var mi=$('[data-a="rmin"]'),se=$('[data-a="rsec"]');
      var v=(parseInt(mi&&mi.value,10)||0)*60+(parseInt(se&&se.value,10)||0);
      setRestDef(v||rEdit);closeSheet();toast('Descanso: '+clk(restDef()*1000));break;
    }
    case 'r+': if(state.rest){state.rest.end+=15000;state.rest.total+=15;saveRs();renderRest();}break;
    case 'r-': if(state.rest){state.rest.end=Math.max(Date.now(),state.rest.end-15000);saveRs();renderRest();}break;
    case 'rstop': endRest(false);break;
    case 'sess': openSess(id);break;
    case 'delsess': {
      state.db.sessions=state.db.sessions.filter(function(s){return s.id!==id;});
      state.db.deleted=(state.db.deleted||[]).concat([id]);
      saveDb();closeSheet();render();toast('Entrenamiento borrado');break;
    }
    case 'editsess': {
      var s2=state.db.sessions.filter(function(x){return x.id===id;})[0];if(!s2)break;
      state.active=JSON.parse(JSON.stringify(s2));state.active.editing=true;saveAc();closeSheet();
      state.view='sesion';render();break;
    }
    case 'repeat': {
      var s3=state.db.sessions.filter(function(x){return x.id===id;})[0];if(!s3)break;
      state.active={id:uid(),routineId:s3.routineId,name:s3.name,start:Date.now(),end:null,note:'',restMs:0,
        entries:(s3.entries||[]).map(function(e){return newEntry({name:e.name,muscle:e.muscle,
          sets:Math.max(1,(e.sets||[]).filter(function(x){return x.done;}).length||e.target.sets),
          rmin:e.target.rmin,rmax:e.target.rmax,bw:e.bw,uni:e.uni});})};
      saveAc();closeSheet();state.view='sesion';render();break;
    }
    case 'editr': editRoutine(id);break;
    case 'rp': exParams(id,i);break;
    case 'ru': case 'rd': {
      var rr=state.db.routines.filter(function(x){return x.id===id;})[0],k=(a==='ru')?i-1:i+1;
      if(k>=0&&k<rr.ex.length){rr.ex.splice(k,0,rr.ex.splice(i,1)[0]);state.db.routinesAt=Date.now();saveDb();editRoutine(id);}
      break;
    }
    case 'rdel': {
      var r2=state.db.routines.filter(function(x){return x.id===id;})[0];
      r2.ex.splice(i,1);state.db.routinesAt=Date.now();saveDb();editRoutine(id);break;
    }
    case 'rsavep': {
      var r3=state.db.routines.filter(function(x){return x.id===id;})[0],e3=r3.ex[i];
      e3.name=($('#pn').value||e3.name).trim();
      e3.sets=clamp(parseInt($('#ps').value,10)||3,1,10);
      e3.rmin=clamp(parseInt($('#pa').value,10)||6,1,50);
      e3.rmax=clamp(parseInt($('#pb').value,10)||12,e3.rmin,60);
      e3.muscle=$('#pm').value;e3.bw=$('#pbw').checked;e3.uni=$('#pu').checked;
      state.db.routinesAt=Date.now();saveDb();editRoutine(id);toast('Actualizado');break;
    }
    case 'radd': openLib(id);break;
    case 'rpick': {
      var r4=state.db.routines.filter(function(x){return x.id===id;})[0];
      r4.ex.push(ex(t.getAttribute('data-n'),t.getAttribute('data-m'),3,8,12));
      state.db.routinesAt=Date.now();saveDb();editRoutine(id);break;
    }
    case 'exp': closeSheet();doExport();break;
    case 'imp': closeSheet();doImport();break;
    case 'wipe': {
      sheet('Borrar todo','<p style="margin:0;color:var(--ink-2)">Se borran todos los entrenamientos y las rutinas vuelven a las originales.</p>',
        '<button class="btn btn-w" data-a="close">Cancelar</button><button class="btn btn-bad btn-w" data-a="wipe-yes">Borrar</button>');break;
    }
    case 'wipe-yes': {
      var del=(state.db.sessions||[]).map(function(s){return s.id;}).concat(state.db.deleted||[]);
      state.db=blankDb();state.db.deleted=del;state.db.routinesAt=Date.now();
      state.active=null;saveAc();saveDb();closeSheet();state.view='inicio';render();toast('Todo borrado');break;
    }
  }
});
function newEntry(e){
  var s=[];for(var i=0;i<(e.sets||3);i++)s.push({w:'',r:'',done:false});
  return {exId:e.id||('e_'+slug(e.name)),name:e.name,muscle:e.muscle,bw:!!e.bw,uni:!!e.uni,time:!!e.time,
    target:{sets:e.sets||3,rmin:e.rmin||8,rmax:e.rmax||12},note:'',sets:s};
}
document.addEventListener('input',function(ev){
  var t=ev.target.closest?ev.target.closest('[data-a]'):null;if(!t)return;
  var a=t.getAttribute('data-a'),i=+t.getAttribute('data-i'),j=+t.getAttribute('data-j');
  if(a==='sw'||a==='sr'){var e=state.active.entries[i];(a==='sw'?e.sets[j].w=t.value:e.sets[j].r=t.value);saveAc();}
  else if(a==='enote'){state.active.entries[i].note=t.value;saveAc();}
  else if(a==='snote'){state.active.note=t.value;saveAc();}
  else if(a==='bw'){state.db.settings.bodyweight=num(t.value)||0;saveDb();}
  else if(a==='rn'){var r=state.db.routines.filter(function(x){return x.id===t.getAttribute('data-id');})[0];r.name=t.value;state.db.routinesAt=Date.now();saveDb();}
  else if(a==='rs'){var r2=state.db.routines.filter(function(x){return x.id===t.getAttribute('data-id');})[0];r2.subtitle=t.value;state.db.routinesAt=Date.now();saveDb();}
});
document.addEventListener('change',function(ev){
  var t=ev.target.closest?ev.target.closest('[data-a]'):null;if(!t)return;
  var a=t.getAttribute('data-a');
  if(a==='snd'){state.db.settings.sound=t.checked;saveDb();if(t.checked)chime();}
  else if(a==='theme'){state.db.settings.theme=t.value;saveDb();theme();}
  else if(a==='pickex'){state.progEx=t.value;render();}
});
document.addEventListener('focusin',function(ev){
  var t=ev.target;if(!t||!t.getAttribute)return;
  var a=t.getAttribute('data-a');
  if(a==='sw'||a==='sr')setTimeout(function(){try{t.select();}catch(e){}},0);
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!$('#ov').hidden)closeSheet();});
document.addEventListener('click',function(ev){var o=$('#ov');if(!o.hidden&&ev.target===o)closeSheet();});

/* ====================== arranque ====================== */
function boot(){
  try{var raw=localStorage.getItem(LS_DB);state.db=raw?JSON.parse(raw):blankDb();}catch(e){state.db=blankDb();}
  if(!state.db||!state.db.v)state.db=blankDb();
  if(!state.db.routines||!state.db.routines.length)state.db.routines=seedRoutines();
  if(!state.db.settings)state.db.settings={rest:120,bodyweight:75,sound:true,theme:'auto'};
  if(!state.db.settings.rest)state.db.settings.rest=120;
  saveDb();migrar();
  try{var av=localStorage.getItem(LS_AC);if(av)state.active=JSON.parse(av);}catch(e){}
  try{var v=localStorage.getItem(LS_VW);if(v)state.view=v;}catch(e){}
  try{state.hideLogin=localStorage.getItem(LS_NL)==='1';}catch(e){}
  try{state.uidPrevio=localStorage.getItem(LS_UID)||'';}catch(e){}
  if((state.view==='sesion'&&!state.active)||state.view==='preview'||state.view==='amigos')state.view='inicio';
  try{var rs=localStorage.getItem(LS_RS);if(rs){var p=JSON.parse(rs);
    if(p&&p.end>Date.now()){state.rest=p;clearInterval(state.restT);state.restT=setInterval(tickRest,250);}
    else localStorage.removeItem(LS_RS);}}catch(e){}
  theme();render();
  document.addEventListener('visibilitychange',function(){if(!document.hidden){refreshBar();renderRest();}});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
